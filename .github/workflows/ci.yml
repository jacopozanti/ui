name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered: this check is required before a pull request can
  # merge, and a required check that never runs leaves the PR waiting for it
  # forever — a PR touching only the README would deadlock.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
